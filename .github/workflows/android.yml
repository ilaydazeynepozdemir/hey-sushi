name: Android

# .aab üretir. Depoda imza sırları varsa imzalı, yoksa doğrulama amaçlı
# imzasız (debug imzalı) çıkar — ikincisi Play'e yüklenemez, sadece derlemenin
# bozulmadığını gösterir.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets bağlamı `if:` içinde kullanılamaz; job env'ine taşıyıp öyle bakıyoruz.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Web derlemesi
        run: npm run build

      - name: Capacitor senkron
        run: npx cap sync android

      - name: İmza anahtarını yaz
        # ANDROID_KEYSTORE_BASE64: `base64 -i hey-sushi-upload.keystore | pbcopy`
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/hey-sushi-upload.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=hey-sushi-upload.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Bundle üret
        run: cd android && ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: hey-sushi-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
