name: iOS

# macOS koşucusunda derler — yerelde Xcode kurulu olmasına gerek yok.
# ios/ klasörü depoda yoksa burada üretilir (Capacitor projesi web'den doğar).
#
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID              Apple Developer takım kimliği (10 karakter)
#   ASC_KEY_ID                 App Store Connect API anahtar kimliği
#   ASC_ISSUER_ID              App Store Connect issuer kimliği
#   ASC_PRIVATE_KEY            .p8 anahtarının içeriği (BEGIN/END satırları dahil)
# Bu sırlar yoksa iş imzasız derleme yapar: kodun bozulmadığını doğrular,
# TestFlight'a yükleyemez.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    # secrets bağlamı `if:` içinde kullanılamaz; job env'ine taşıyıp öyle bakıyoruz.
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Web derlemesi
        run: npm run build

      - name: iOS projesi (yoksa üret)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
            npx capacitor-assets generate --ios || true
          fi
          npx cap sync ios

      - name: Pod kurulumu
        run: cd ios/App && pod install

      - name: İmzasız doğrulama derlemesi
        if: env.ASC_KEY_ID == ''
        run: |
          echo "İmza sırları yok → yalnızca derleme doğrulaması yapılıyor."
          cd ios/App && xcodebuild \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build

      - name: App Store Connect API anahtarı
        if: env.ASC_KEY_ID != ''
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Arşiv ve dışa aktarım
        if: env.ASC_KEY_ID != ''
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: env.ASC_KEY_ID != ''
        with:
          name: hey-sushi-ipa
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: error
